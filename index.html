<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#120808" />
    <title>SULLEN DESCENT — Sullen Studio</title>
  </head>
  <body>
    <div id="app">
      <canvas id="view"></canvas>
      <div id="alive-block">
        <span id="alive-label">HOSTILES</span>
        <span id="alive">0</span>
      </div>
      <div id="hud">
        <div id="hp-block" data-tone="ok">
          <span id="hp-icon" aria-hidden="true">+</span>
          <span id="hp">100</span>
        </div>
        <div id="hud-center">
          <span id="level-name">INTAKE</span>
          <span id="kills">0</span>
        </div>
        <div id="ammo-block">
          <span id="weapon-label">PISTOL</span>
          <div id="ammo-row">
            <span id="ammo">8</span>
            <span id="ammo-res">40</span>
          </div>
        </div>
      </div>
      <div id="overlay">
        <p class="mark">SULLEN STUDIO</p>
        <h1>SULLEN DESCENT</h1>
        <p>a cramped corridor shooter</p>
        <button type="button" id="btn-play">DESCEND</button>
        <p class="hint">WASD move · mouse look · click fire · 1-4 · Q prev · E next · F melee · R reload · clear the map to open the gate · pick up drops</p>
      </div>
      <div id="mobile-ui">
        <div id="stick"></div>
        <div id="mobile-actions">
          <button type="button" id="btn-swap">SWAP</button>
          <button type="button" id="btn-fire">FIRE</button>
        </div>
      </div>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
