<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#120808" />
    <title>SULLEN DESCENT — Sullen Studio</title>
  </head>
  <body>
    <div id="app">
      <canvas id="view"></canvas>
      <div id="hud">
        <span id="hp">HP 100</span>
        <span id="ammo">AMMO 40</span>
        <span id="kills">KILLS 0</span>
      </div>
      <div id="overlay">
        <p class="mark">SULLEN STUDIO</p>
        <h1>SULLEN DESCENT</h1>
        <p>a cramped corridor shooter</p>
        <button type="button" id="btn-play">DESCEND</button>
        <p class="hint">WASD move · mouse look · click fire · Q swap · 1/2 select · F stick · R reload · Esc release cursor</p>
      </div>
      <div id="mobile-ui">
        <div id="stick"></div>
        <div id="mobile-actions">
          <button type="button" id="btn-swap">SWAP</button>
          <button type="button" id="btn-fire">FIRE</button>
        </div>
      </div>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
